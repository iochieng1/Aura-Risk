# Weekly, grouped dependency updates (#87). Security updates are separate:
# Dependabot opens them as soon as an advisory is published, ignoring the
# schedule, groups and the ignore rules below.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /aurarisk-backend
    schedule:
      interval: weekly
      day: monday
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /aurarisk-frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      web-production:
        dependency-type: production
      web-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /aurarisk-mobile
    schedule:
      interval: weekly
      day: monday
    groups:
      mobile-production:
        dependency-type: production
      mobile-development:
        dependency-type: development
    # Expo pins compatible versions of these per SDK release. Move them with an
    # SDK upgrade (`npx expo install --fix`), not one by one.
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /packages/shared
    schedule:
      interval: weekly
      day: monday
    groups:
      shared:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
