name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurarisk-backend
    services:
      postgres:
        # PostGIS is required by migration 007 (#18).
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aurarisk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d aurarisk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Enables the Postgres integration tests (notifier, curation, moderation).
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/aurarisk_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aurarisk-backend/go.mod
          cache-dependency-path: aurarisk-backend/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - name: Build the deploy image
        run: docker build --build-arg VERSION=${{ github.sha }} -t aurarisk-backend:ci .

  publish:
    name: Publish image
    # Every main build becomes an immutable, deployable image tagged with its
    # commit (docs/RELEASE.md). PRs only build it, in the backend job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, mobile, frontend, observability, deploy-config, dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        working-directory: aurarisk-backend
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aurarisk-backend
          docker build --build-arg VERSION=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$image:sha-${{ github.sha }}" -t "$image:main" .
          docker push "$image:sha-${{ github.sha }}"
          docker push "$image:main"
          echo "Published $image:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  mobile:
    name: Mobile and shared package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurarisk-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aurarisk-mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # Also runs packages/shared tests.
      - run: npx jest --ci

  frontend:
    name: Web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurarisk-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aurarisk-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Typechecks (tsc -b) and builds.
      - run: npm run build

  observability:
    name: Alert rules and monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and test Prometheus rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules /p/alerts_test.yml
      - name: Validate Alertmanager config
        run: |
          docker run --rm -v "$PWD/observability/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Validate Loki and Alloy config
        run: |
          docker run --rm -v "$PWD/observability/loki:/etc/loki:ro" \
            grafana/loki:3.7.8 -config.file=/etc/loki/loki.yml -verify-config
          docker run --rm -v "$PWD/observability/alloy:/etc/alloy:ro" \
            grafana/alloy:v1.20.1 validate /etc/alloy/config.alloy
      - name: Validate dashboard JSON
        run: python3 -m json.tool observability/grafana/dashboards/aurarisk-overview.json > /dev/null

  deploy-config:
    name: Deploy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e API_HOST=api.example.org -e WEB_HOST=example.org -e ACME_EMAIL=ops@example.org \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate the production compose file
        run: |
          cp deploy/env/production.env.example deploy/env/production.env
          IMAGE_TAG=sha-ci docker compose -f deploy/docker-compose.prod.yml \
            --env-file deploy/env/production.env config --quiet
      - name: Check scripts
        run: shellcheck deploy/scripts/*.sh

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    # Fails when code paths reach a known vulnerability in Go or a module.
    # Fix by upgrading the go directive in go.mod (to a supported release) or
    # the affected module.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aurarisk-backend/go.mod
          cache-dependency-path: aurarisk-backend/go.sum
      - name: govulncheck
        working-directory: aurarisk-backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
