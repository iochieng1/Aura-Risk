services:
  postgres:
    image: postgres:16-alpine
    container_name: aurarisk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aurarisk
    ports:
      - "5432:5432"
    volumes:
      - aurarisk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurarisk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurarisk_pgdata:
