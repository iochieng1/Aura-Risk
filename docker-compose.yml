# Credentials come from the repo-root .env (cp .env.example .env).
# Compose refuses to start if any of them are missing.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aurarisk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aurarisk}
    ports:
      - "5432:5432"
    volumes:
      - aurarisk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for photo attachments (local development only).
  objectstore:
    image: rustfs/rustfs:1.0.1
    container_name: aurarisk-objectstore
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
    ports:
      - "9000:9000"
    volumes:
      - aurarisk_objects:/data

  objectstore-init:
    image: amazon/aws-cli:latest
    depends_on:
      - objectstore
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://objectstore:9000 s3api head-bucket --bucket aurarisk-photos 2>/dev/null && exit 0
          aws --endpoint-url http://objectstore:9000 s3api create-bucket --bucket aurarisk-photos && exit 0
          sleep 2
        done
        exit 1
    restart: "no"

  # Malware scanner for uploaded photos. First start downloads signatures (~1-3 min).
  clamav:
    image: clamav/clamav:stable
    container_name: aurarisk-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - aurarisk_clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  # --- Monitoring (opt-in): docker compose --profile monitoring up -d ---
  # Dashboards, alert rules, and routing live in observability/. The backend
  # runs on the host, so set METRICS_ADDR=:9464 in .env for Prometheus to reach it.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - aurarisk_prometheus:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      # Mounted as a directory so a missing secrets/ folder is not an error.
      - ./observability/alertmanager:/etc/alertmanager:ro
      - aurarisk_alertmanager:/alertmanager

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-aurarisk}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  # Local only: anonymous editor access on 127.0.0.1 with the login form off,
  # so there is no default admin password. Production Grafana is configured
  # separately (see docs/ON_CALL.md).
  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aurarisk-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aurarisk_grafana:/var/lib/grafana

volumes:
  aurarisk_pgdata:
  aurarisk_objects:
  aurarisk_clamdb:
  aurarisk_prometheus:
  aurarisk_alertmanager:
  aurarisk_grafana:
