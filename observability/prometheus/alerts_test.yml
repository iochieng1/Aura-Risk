# Run: docker run --rm -v "$PWD/observability/prometheus:/p:ro" --entrypoint promtool \
#        prom/prometheus:v3.5.0 test rules /p/alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: Open-Meteo failures page the weather owner
    interval: 1m
    input_series:
      - series: 'aurarisk_provider_requests_total{provider="open_meteo",operation="forecast",outcome="success"}'
        values: '0+1x10 10x30'
      - series: 'aurarisk_provider_requests_total{provider="open_meteo",operation="forecast",outcome="error"}'
        values: '0x10 0+2x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: AuraRiskWeatherProviderFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: AuraRiskWeatherProviderFailing
        exp_alerts:
          - exp_labels:
              severity: page
              team: backend
              component: weather
            exp_annotations:
              summary: "100% of Open-Meteo calls are failing"
              description: "Risk lookups fall back to stale cached data or 503, and the notifier cannot assess subscriptions while Open-Meteo fails."
              runbook_url: "https://github.com/iochieng1/Aura-Risk/blob/main/docs/ON_CALL.md#aurariskweatherproviderfailing"

  - name: Stale weather pages only while weather is being requested
    interval: 1m
    input_series:
      # Last success at t=10m (600s), then only failures.
      - series: 'aurarisk_provider_last_success_timestamp_seconds{provider="open_meteo",instance="api-1"}'
        values: '0+60x10 600x60'
      - series: 'aurarisk_provider_requests_total{provider="open_meteo",operation="forecast",outcome="error"}'
        values: '0x10 0+1x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: AuraRiskWeatherDataStale
        exp_alerts: []
      - eval_time: 50m
        alertname: AuraRiskWeatherDataStale
        exp_alerts:
          - exp_labels:
              severity: page
              team: backend
              component: weather
            exp_annotations:
              summary: "No successful weather fetch for 40m 0s"
              description: "Weather is being requested but every call fails, so /api/risk serves stale data or 503 and the notifier cannot evaluate subscriptions."
              runbook_url: "https://github.com/iochieng1/Aura-Risk/blob/main/docs/ON_CALL.md#aurariskweatherdatastale"

  - name: Idle server is not stale
    interval: 1m
    input_series:
      - series: 'aurarisk_provider_last_success_timestamp_seconds{provider="open_meteo",instance="api-1"}'
        values: '0x120'
      - series: 'aurarisk_provider_requests_total{provider="open_meteo",operation="forecast",outcome="success"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 2h
        alertname: AuraRiskWeatherDataStale
        exp_alerts: []

  - name: Push provider failures page
    interval: 1m
    input_series:
      - series: 'aurarisk_provider_requests_total{provider="expo_push",operation="send",outcome="error"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AuraRiskPushProviderFailing
        exp_alerts:
          - exp_labels:
              severity: page
              team: backend
              component: push
            exp_annotations:
              summary: "100% of Expo push requests are failing"
              description: "Flood alerts are not reaching devices. Undelivered alerts are retried on the next notifier run."
              runbook_url: "https://github.com/iochieng1/Aura-Risk/blob/main/docs/ON_CALL.md#aurariskpushproviderfailing"

  - name: Exhausted DB pool pages
    interval: 1m
    input_series:
      - series: 'go_sql_wait_duration_seconds_total{job="aurarisk-backend",instance="api-1",db_name="aurarisk"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: AuraRiskDbPoolWaiting
        exp_alerts:
          - exp_labels:
              severity: page
              team: backend
              component: database
              instance: api-1
            exp_annotations:
              summary: "api-1: requests are blocked waiting for DB connections"
              description: "On average 1.00 requests are waiting for a pooled connection. The pool is exhausted."
              runbook_url: "https://github.com/iochieng1/Aura-Risk/blob/main/docs/ON_CALL.md#aurariskdbpoolsaturated"

  - name: Notifier that never succeeds pages
    interval: 1m
    input_series:
      - series: 'aurarisk_worker_runs_total{worker="notifier",outcome="error"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AuraRiskNotifierFailing
        exp_alerts:
          - exp_labels:
              severity: page
              team: backend
              component: push
            exp_annotations:
              summary: "Every notifier run in the last hour failed"
              runbook_url: "https://github.com/iochieng1/Aura-Risk/blob/main/docs/ON_CALL.md#aurarisknotifierstalled"

  - name: Stalled retention worker opens a ticket
    interval: 1m
    input_series:
      - series: 'aurarisk_worker_last_success_timestamp_seconds{worker="retention",instance="api-1"}'
        values: '0x300'
      - series: 'aurarisk_worker_interval_seconds{worker="retention",instance="api-1"}'
        values: '3600x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: AuraRiskReportCurationStalled
        exp_alerts: []
      - eval_time: 3h30m
        alertname: AuraRiskReportCurationStalled
        exp_alerts:
          - exp_labels:
              severity: ticket
              team: backend
              component: reports
              worker: retention
            exp_annotations:
              summary: "The retention worker has not completed a run in 3h 30m 0s"
              description: "Reports are not being auto-verified, or expired data is not being deleted on schedule."
              runbook_url: "https://github.com/iochieng1/Aura-Risk/blob/main/docs/ON_CALL.md#aurariskreportcuration"
